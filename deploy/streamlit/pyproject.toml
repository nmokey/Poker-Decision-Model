[project]
name = "pocketsolver-streamlit-deployment"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["poker-decision-model[demo,llm,ml]", "torch>=2.6,<3"]

[tool.uv]
package = false

[tool.uv.sources]
poker-decision-model = { path = "../.." }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
