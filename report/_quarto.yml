project:
  type: default
  output-dir: _site
  render:
    - index.qmd
  resources:
    - assets/
    - generated/report-data.json
    - generated/provenance.json
    - generated/figures/*.svg
    - generated/figures/*.pdf
    - generated/tables/*.csv
format:
  html:
    theme: none
    css: assets/article.css
    toc: true
    toc-title: Contents
    toc-depth: 2
    number-sections: true
    anchor-sections: true
    html-math-method: mathjax
    include-before-body: assets/before.html
    include-after-body:
      - generated/embedded-data.html
      - assets/interactive.html
    lang: en
  pdf:
    include-in-header: assets/print-header.tex
    documentclass: article
    pdf-engine: pdflatex
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
    colorlinks: true
    keep-tex: true
    toc: false
    number-sections: true
    fig-pos: H
    link-citations: true
  latex:
    include-in-header: assets/print-header.tex
    pdf-engine: pdflatex
    colorlinks: true
    fig-pos: H
    documentclass: article
    papersize: letter
    fontsize: 11pt
    geometry:
      - margin=1in
    number-sections: true
filters:
  - filters/results.lua
bibliography: references.bib
link-citations: true
execute:
  enabled: false
